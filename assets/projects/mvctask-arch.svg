<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190724"/>
      <stop offset="60%" stop-color="#0a030f"/>
      <stop offset="100%" stop-color="#020104"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg3)"/>

  <!-- Top Bar -->
  <rect x="0" y="0" width="600" height="36" fill="rgba(0, 0, 0, 0.7)" stroke="rgba(168, 85, 247, 0.2)" stroke-width="1"/>
  <circle cx="20" cy="18" r="4.5" fill="#ef4444"/>
  <circle cx="35" cy="18" r="4.5" fill="#fbbf24"/>
  <circle cx="50" cy="18" r="4.5" fill="#c084fc"/>
  <text x="75" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">MVCTASK // 3-TIER CLEAN ARCHITECTURE SCHEMATIC (.NET 9)</text>

  <!-- Tier 1: Presentation -->
  <rect x="30" y="55" width="540" height="68" rx="8" fill="rgba(168, 85, 247, 0.12)" stroke="rgba(168, 85, 247, 0.45)" stroke-width="1.5"/>
  <text x="50" y="80" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">LAYER 1: PRESENTATION (ASP.NET Core 9 MVC)</text>
  <text x="50" y="104" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">DepartmentController • InstructorController • ActionFilters • ViewModels</text>

  <text x="300" y="140" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-anchor="middle">↓ AutoMapper DTOs &amp; Service Interfaces ↓</text>

  <!-- Tier 2: Business / Service -->
  <rect x="30" y="150" width="540" height="68" rx="8" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.5"/>
  <text x="50" y="175" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">LAYER 2: BUSINESS LOGIC &amp; DOMAIN SERVICES</text>
  <text x="50" y="199" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">DepartmentService • FluentValidation • Business Rules • Domain Entities</text>

  <text x="300" y="235" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" text-anchor="middle">↓ Generic Repository &amp; Unit of Work ↓</text>

  <!-- Tier 3: Data Access -->
  <rect x="30" y="245" width="540" height="72" rx="8" fill="rgba(0, 255, 102, 0.12)" stroke="rgba(0, 255, 102, 0.45)" stroke-width="1.5"/>
  <text x="50" y="270" fill="#00ff66" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">LAYER 3: DATA ACCESS &amp; RESILIENCE (EF Core 9 + SQL Server)</text>
  <text x="50" y="294" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">IRepository&lt;T&gt; • DbContext Pool • Polly 3x Exponential Backoff Retry Resilience</text>
</svg>